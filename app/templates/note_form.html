<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f2">
    <title>{{ page_title }} · StudyFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="/dashboard" aria-label="StudyFlow Dashboard">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span>StudyFlow</span>
        </a>
        <nav class="topbar-links" aria-label="工作台导航">
          <a href="/dashboard">Dashboard</a>
          <a href="/projects">项目</a>
          <a href="/tasks">任务</a>
          <a href="/plans">学习计划</a>
        </nav>
      </header>

      <section class="auth-card form-card note-form-card" aria-labelledby="note-form-title">
        <p class="eyebrow"><span class="status-dot"></span>MARKDOWN NOTE</p>
        <h1 id="note-form-title">{{ page_title }}</h1>
        {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}

        <form action="{{ form_action }}" method="post" class="setup-form">
          <label class="form-field">
            <span>标题</span>
            <input type="text" name="title" value="{{ form.title }}" maxlength="200" required>
          </label>
          <label class="form-field">
            <span>关联项目（可选）</span>
            <select name="project_id">
              <option value="">不关联项目</option>
              {% for project in projects %}
              <option value="{{ project.id }}" {% if form.project_id|string == project.id|string %}selected{% endif %}>
                {{ project.name }}{% if project.status == "archived" %}（已归档）{% endif %}
              </option>
              {% endfor %}
            </select>
          </label>
          <label class="form-field">
            <span>Markdown 原文</span>
            <textarea name="content_markdown" rows="20" spellcheck="false">{{ form.content_markdown }}</textarea>
          </label>
          <button class="primary-button" type="submit">保存笔记</button>
          <a class="text-link" href="/notes">返回笔记列表</a>
        </form>
      </section>

      <footer class="footer">
        <span>使用 Markdown 记录和整理知识。</span>
        <span class="footer-mark">STUDYFLOW <span aria-hidden="true">·</span> NOTES</span>
      </footer>
    </main>
  </body>
</html>
